name: Conditional inspection of loader code
on:
  push:
    branches: ['ci/loader-inspection-011']
    paths:
      - 'loader011/*.py'
      - '.github/workflows/soma-loader-011.yml'
permissions:
  contents: read
concurrency:
  group: loader-inspection-011
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'artemidamoon2223-collab/SOMA-Public-Tests'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Evaluate schedules and audit receipts
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          /usr/bin/python3 -I -c 'import sys; assert sys.version_info[:2] == (3, 12); print(sys.version)'
          ulimit -t 30 -v 524288 -f 4096 -n 128 -u 128
          report="$RUNNER_TEMP/loader011.json"
          timeout -k 3 45 /usr/bin/python3 -I -B loader011/experiment.py >"$report"
          printf 'REPORT '
          cat "$report"
          timeout -k 3 15 /usr/bin/python3 -I -B loader011/audit.py "$report" "$SOURCE_SHA"
